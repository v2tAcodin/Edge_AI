<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#05070d" />
    </radialGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00ff9d" />
      <stop offset="100%" stop-color="#b05cff" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="3" />

  <!-- Circuit Pattern Background Lines -->
  <path d="M64 128 h80 l32 32 h128" stroke="rgba(0, 240, 255, 0.15)" stroke-width="2" fill="none" />
  <circle cx="304" cy="160" r="4" fill="#00f0ff" opacity="0.4" />
  <path d="M448 384 h-80 l-32 -32 h-128" stroke="rgba(0, 255, 157, 0.15)" stroke-width="2" fill="none" />
  <circle cx="208" cy="352" r="4" fill="#00ff9d" opacity="0.4" />

  <!-- Hexagon Frame -->
  <polygon points="256,76 396,156 396,316 256,396 116,316 116,156" fill="rgba(10, 18, 36, 0.6)" stroke="url(#cyberNeon)" stroke-width="8" filter="url(#neonGlow)" />

  <!-- Core Lightning Bolt (Edge AI Symbol) -->
  <path d="M276 128 L196 264 L252 264 L236 384 L316 248 L260 248 Z" fill="url(#cyberNeon)" filter="url(#neonGlow)" />

  <!-- Neural Dot Matrix Nodes -->
  <circle cx="256" cy="76" r="6" fill="#00f0ff" />
  <circle cx="396" cy="156" r="6" fill="#00ff9d" />
  <circle cx="396" cy="316" r="6" fill="#00f0ff" />
  <circle cx="256" cy="396" r="6" fill="#00ff9d" />
  <circle cx="116" cy="316" r="6" fill="#b05cff" />
  <circle cx="116" cy="156" r="6" fill="#00f0ff" />

  <!-- Typography: EDGE AI -->
  <text x="256" y="445" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="800" fill="#00f0ff" text-anchor="middle" letter-spacing="4">EDGE AI // HUB</text>
</svg>
